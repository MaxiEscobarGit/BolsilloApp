# Avisos semanales de dependencias desactualizadas o vulnerables (seguridad: SDKs al día).
version: 2
updates:
  - package-ecosystem: maven
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly }
