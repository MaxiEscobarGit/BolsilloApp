# Perfil PROD — sin defaults: si falta alguna variable, la app NO arranca.
# Requeridas: DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD, JWT_SECRET, ANTHROPIC_API_KEY
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
app.jwt.secret=${JWT_SECRET}
anthropic.api-key=${ANTHROPIC_API_KEY}

# Origenes web permitidos (coma separados). Vacio = no se permite ningun origen cross-site.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Detras del proxy de Railway: usar X-Forwarded-For (solo de proxies internos) para la IP real
server.forward-headers-strategy=native

# Nunca filtrar detalles de errores
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
