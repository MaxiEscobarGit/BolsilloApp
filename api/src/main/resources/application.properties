spring.application.name=api
# Perfil por defecto si no se define SPRING_PROFILES_ACTIVE. En Railway: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# DataSource
# ponytail: options=-c timezone=UTC fuerza timezone en handshake JDBC, evita el bug de Windows con America/Buenos_Aires
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (secret en Base64, minimo 256 bits; se valida al arrancar)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# Anthropic
anthropic.api-key=${ANTHROPIC_API_KEY}

# Security
# Sin defaults de secretos aca: los defaults locales viven en application-dev.properties
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.security.login.max-attempts=5
app.security.login.window=15m
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
