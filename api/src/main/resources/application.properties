spring.application.name=api
# Perfil por defecto si no se define SPRING_PROFILES_ACTIVE. En Railway: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# DataSource
# ponytail: options=-c timezone=UTC fuerza timezone en handshake JDBC, evita el bug de Windows con America/Buenos_Aires
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (secret en Base64, minimo 256 bits; se valida al arrancar)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# Anthropic
anthropic.api-key=${ANTHROPIC_API_KEY}

# Security
# Sin defaults de secretos aca: los defaults locales viven en application-dev.properties
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.security.login.max-attempts=5
app.security.login.window=15m
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Infra
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Exchange rates
# API pública de cotizaciones (GET {base-url}/v1/dolares). Se guarda el valor de venta.
exchange-rates.base-url=${EXCHANGE_RATES_BASE_URL:https://dolarapi.com}
exchange-rates.sources=oficial,blue,mep,tarjeta
# Cron de Spring (seg min hora dia mes dia-semana); "-" lo desactiva.
exchange-rates.cron=${EXCHANGE_RATES_CRON:0 5 10-18/2 * * MON-FRI}
exchange-rates.zone=America/Argentina/Buenos_Aires
exchange-rates.timeout=5s
exchange-rates.load-on-startup=${EXCHANGE_RATES_LOAD_ON_STARTUP:true}

# Chat
anthropic.model.fast=${ANTHROPIC_MODEL_FAST:claude-haiku-5-5}
anthropic.model.smart=${ANTHROPIC_MODEL_SMART:claude-sonnet-5-5}
