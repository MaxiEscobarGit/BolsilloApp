spring.application.name=api

# DataSource
# ponytail: options=-c timezone=UTC fuerza timezone en handshake JDBC, evita el bug de Windows con America/Buenos_Aires
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finanzas_dev?options=-c%20timezone%3DUTC}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres123}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:hH4d9Xa3M5mskNX0MCXF1+OkKUFPg3nllFdSydPyXv0=}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# Anthropic
anthropic.api-key=${ANTHROPIC_API_KEY:sk-ant-placeholder}
