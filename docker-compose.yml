# SOLO DESARROLLO LOCAL — nunca usar estos valores en producción
services:
  postgres:
    image: postgres:16
    container_name: finanzas-db
    environment:
      POSTGRES_DB: finanzas_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finanzas_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finanzas-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finanzas-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finanzas-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  finanzas-net:
