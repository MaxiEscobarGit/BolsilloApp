# SOLO DESARROLLO LOCAL — nunca usar estos valores en producción
services:
  postgres:
    image: postgres:16
    container_name: finanzas-db
    environment:
      POSTGRES_DB: finanzas_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finanzas_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finanzas-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finanzas-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finanzas-net

  # API opcional: docker compose --profile api up -d --build
  api:
    build: ./api
    container_name: finanzas-api
    profiles: ["api"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/finanzas_dev
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-hH4d9Xa3M5mskNX0MCXF1+OkKUFPg3nllFdSydPyXv0=}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-placeholder}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finanzas-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  finanzas-net:
